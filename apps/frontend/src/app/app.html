<header class="topbar">
  <h1>Finanzas en pareja</h1>

  <nav>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/ingresos" routerLinkActive="active">Ingresos</a>
    <a routerLink="/presupuestos" routerLinkActive="active">Presupuestos</a>
    <a routerLink="/gastos" routerLinkActive="active">Mercado / gastos</a>
    <a routerLink="/catalogos" routerLinkActive="active">Catálogos</a>
  </nav>

  <select (change)="elegirUsuario($event)">
    @for (usuario of session.usuarios(); track usuario.id) {
      <option [value]="usuario.id" [selected]="usuario.id === session.usuarioActualId()">
        {{ usuario.nombre }}
      </option>
    }
  </select>
</header>

<main>
  <router-outlet />
</main>

@if (notification.mensaje(); as mensaje) {
  <div class="popup-overlay" (click)="notification.cerrar()">
    <div class="popup" (click)="$event.stopPropagation()">
      <p>{{ mensaje }}</p>
      <button (click)="notification.cerrar()">Cerrar</button>
    </div>
  </div>
}
