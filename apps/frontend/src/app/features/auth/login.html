<mat-card class="auth-card">
  <mat-card-content>
    <h2>Iniciar sesión</h2>
    <form class="form-grid" (ngSubmit)="ingresar()">
      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput name="email" type="email" [(ngModel)]="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput name="password" type="password" [(ngModel)]="password" required />
      </mat-form-field>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="cargando()">Entrar</button>
      </div>
    </form>

    <p>¿No tienes cuenta? <a class="auth-link" routerLink="/registro">Regístrate</a></p>
  </mat-card-content>
</mat-card>
