@if (session.usuario()?.hogarId) {
  <mat-toolbar class="topbar">
    <span class="brand">Finanzas en pareja</span>

    <nav class="topbar-nav">
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
      <a mat-button routerLink="/ingresos" routerLinkActive="active-link">Ingresos</a>
      <a mat-button routerLink="/presupuestos" routerLinkActive="active-link">Presupuestos</a>
      <a mat-button routerLink="/creditos" routerLinkActive="active-link">Créditos</a>
      <a mat-button routerLink="/gastos" routerLinkActive="active-link">Mercado / gastos</a>
      <a mat-button routerLink="/catalogos" routerLinkActive="active-link">Catálogos</a>
      <a mat-button routerLink="/invitar" routerLinkActive="active-link">Invitar</a>
    </nav>

    <span class="spacer"></span>

    <span class="user-name">
      <mat-icon>account_circle</mat-icon>
      {{ session.usuario()?.nombre }}
    </span>
    <button mat-stroked-button (click)="cerrarSesion()">Cerrar sesión</button>
  </mat-toolbar>
}

<main>
  <router-outlet />
</main>
