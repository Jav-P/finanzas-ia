<mat-card class="auth-card-centered">
  <mat-card-content>
    <h2>Todavía no perteneces a ningún hogar</h2>
    <p>
      Si alguien te invitó, pídele que te reenvíe el link de invitación.
      Si quieres empezar de cero, cierra sesión y crea una cuenta nueva
      con un hogar propio.
    </p>
    <button mat-stroked-button (click)="cerrarSesion()">Cerrar sesión</button>
  </mat-card-content>
</mat-card>
