<mat-card class="auth-card">
  <mat-card-content>
    <h2>Crear cuenta</h2>

    @if (invitacion(); as inv) {
      <p>Te invitaron a unirte al hogar <strong>{{ inv.hogarNombre }}</strong>.</p>
    }

    <form class="form-grid" (ngSubmit)="registrar()">
      <mat-form-field appearance="outline">
        <mat-label>Tu nombre</mat-label>
        <input matInput name="nombre" [(ngModel)]="nombre" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput name="email" type="email" [(ngModel)]="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput name="password" type="password" [(ngModel)]="password" required minlength="6" />
      </mat-form-field>

      @if (!invitacionToken()) {
        <mat-form-field appearance="outline">
          <mat-label>Nombre de tu hogar</mat-label>
          <input matInput name="nombreHogar" [(ngModel)]="nombreHogar" placeholder="ej. Javi y Xime" required />
        </mat-form-field>
      }

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="cargando()">Crear cuenta</button>
      </div>
    </form>

    <p>¿Ya tienes cuenta? <a class="auth-link" routerLink="/login">Inicia sesión</a></p>
  </mat-card-content>
</mat-card>
