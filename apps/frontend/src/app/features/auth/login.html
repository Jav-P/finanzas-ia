<div class="card" style="max-width:400px; margin: 3rem auto;">
  <h2>Iniciar sesión</h2>
  <form (ngSubmit)="ingresar()">
    <label>
      Correo
      <input name="email" type="email" [(ngModel)]="email" required />
    </label>
    <label>
      Contraseña
      <input name="password" type="password" [(ngModel)]="password" required />
    </label>

    @if (error()) {
      <p style="color:#dc2626">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">Entrar</button>
  </form>

  <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</div>
