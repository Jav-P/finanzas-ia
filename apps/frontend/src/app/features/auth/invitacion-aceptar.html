@if (invitacion(); as inv) {
  <mat-card class="auth-card-centered">
    <mat-card-content>
      <h2>Te invitaron a un hogar</h2>
      <p>
        Te invitaron a unirte al hogar <strong>{{ inv.hogarNombre }}</strong>.
        ¿Aceptas?
      </p>
      <div class="form-actions" style="justify-content:center;">
        <button mat-flat-button (click)="aceptar()" [disabled]="procesando()">Aceptar</button>
        <button mat-stroked-button (click)="rechazar()" [disabled]="procesando()">Rechazar</button>
      </div>
    </mat-card-content>
  </mat-card>
}

@if (error()) {
  <p class="error-text" style="text-align:center;">{{ error() }}</p>
}
