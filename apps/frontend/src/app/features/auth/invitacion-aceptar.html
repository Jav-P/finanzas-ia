<div class="card" style="max-width:420px; margin: 3rem auto; text-align:center;">
  @if (invitacion(); as inv) {
    <h2>Te invitaron a un hogar</h2>
    <p>
      Te invitaron a unirte al hogar <strong>{{ inv.hogarNombre }}</strong>.
      ¿Aceptas?
    </p>
    <div style="display:flex; gap:0.5rem; justify-content:center;">
      <button (click)="aceptar()" [disabled]="procesando()">Aceptar</button>
      <button (click)="rechazar()" [disabled]="procesando()">Rechazar</button>
    </div>
  }

  @if (error()) {
    <p style="color:#dc2626">{{ error() }}</p>
  }
</div>
