<div class="auth-shell">
  <mat-card class="auth-card">
    <mat-card-content>
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <mat-icon>savings</mat-icon>
        </div>
        <span>Finanzas en pareja</span>
      </div>

      <h2 style="text-align:center;">Elige una contraseña nueva</h2>

      @if (listo()) {
        <p style="text-align:center;">Listo, tu contraseña quedó actualizada. Te llevamos a iniciar sesión...</p>
      } @else {
        <form class="form-grid" (ngSubmit)="guardar()">
          <mat-form-field appearance="outline">
            <mat-label>Contraseña nueva</mat-label>
            <input matInput name="passwordNueva" [type]="mostrarPassword() ? 'text' : 'password'" [(ngModel)]="passwordNueva" required />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="mostrarPassword.set(!mostrarPassword())"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <mat-icon>{{ mostrarPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-hint>Mínimo 6 caracteres</mat-hint>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Repite la contraseña nueva</mat-label>
            <input matInput name="passwordConfirmar" type="password" [(ngModel)]="passwordConfirmar" required />
          </mat-form-field>

          @if (error()) {
            <p class="error-text">{{ error() }}</p>
          }

          <div class="form-actions">
            <button mat-flat-button type="submit" [disabled]="guardando()" style="width:100%;">
              Guardar contraseña
            </button>
          </div>
        </form>

        <p style="text-align:center;"><a class="auth-link" routerLink="/login">Volver a iniciar sesión</a></p>
      }
    </mat-card-content>
  </mat-card>
</div>
