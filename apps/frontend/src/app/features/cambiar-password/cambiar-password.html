<div class="page-head">
  <h1>Cambiar contraseña</h1>
</div>

<mat-card class="card-section cambiar-password-card">
  <mat-card-content>
    <form class="form-grid" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline">
        <mat-label>Contraseña actual</mat-label>
        <input matInput name="passwordActual" [type]="mostrarActual() ? 'text' : 'password'" [(ngModel)]="passwordActual" required />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="mostrarActual.set(!mostrarActual())"
          [attr.aria-label]="mostrarActual() ? 'Ocultar' : 'Mostrar'"
        >
          <mat-icon>{{ mostrarActual() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña nueva</mat-label>
        <input matInput name="passwordNueva" [type]="mostrarNueva() ? 'text' : 'password'" [(ngModel)]="passwordNueva" required />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="mostrarNueva.set(!mostrarNueva())"
          [attr.aria-label]="mostrarNueva() ? 'Ocultar' : 'Mostrar'"
        >
          <mat-icon>{{ mostrarNueva() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-hint>Mínimo 6 caracteres</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Repite la contraseña nueva</mat-label>
        <input matInput name="passwordConfirmar" type="password" [(ngModel)]="passwordConfirmar" required />
      </mat-form-field>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="guardando()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
